# MT - CI/CD Pipeline
#
# Features:
# - Automated testing on every push/PR
# - Security vulnerability scanning
# - Code quality checks (biome, ruff, TypeScript)
# - Inference service tests (pytest + ruff)
# - Build artifact generation
# - PM2-based deployment on main branch
# - Rollback on failure

name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  # ============================================================================
  # Security & Quality Checks
  # ============================================================================
  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          cd backend && pnpm install
          cd ../frontend && pnpm install

      - name: Run npm audit (backend)
        run: cd backend && pnpm audit --audit-level=high
        continue-on-error: true

      - name: Run npm audit (frontend)
        run: cd frontend && pnpm audit --audit-level=high
        continue-on-error: true

      - name: Run security audit with Snyk
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high
          command: monitor

  lint-and-typecheck:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          cd backend && pnpm install
          cd ../frontend && pnpm install

      # pnpm skips @prisma/client's postinstall when every package resolves
      # from a warm store cache (observed: "reused 382 … Done in 1.4s", zero
      # postinstall lines, tsc dies on 'no exported member PrismaClient').
      # Generate explicitly — never depend on postinstall having run.
      - name: Generate Prisma client
        run: cd backend && npx prisma generate

      - name: Type check backend
        run: cd backend && pnpm run type-check
        continue-on-error: false

      - name: Lint backend
        run: cd backend && pnpm run lint
        continue-on-error: false

      - name: Type check frontend
        run: cd frontend && pnpm run type-check
        continue-on-error: false

      - name: Lint frontend
        run: cd frontend && pnpm run lint
        continue-on-error: false

  # ============================================================================
  # Testing
  # ============================================================================
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install PostgreSQL and Redis
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql redis-server
          sudo systemctl start postgresql
          sudo systemctl start redis-server
          sudo -u postgres psql -c "ALTER USER postgres WITH PASSWORD 'postgres';" || true
          sudo -u postgres createdb mt_test || true

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          cd backend && pnpm install

      # Route integration tests drive the real backend↔inference contract
      # (POST /api/inference/predict → :10810). Chronos preload self-skips
      # when no weights are cached (services/inference_engine.py checks the
      # HF snapshot dir on disk), so a cold runner boots statistical models
      # only — arima, the algorithm these tests request.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Start inference service
        run: |
          cd inference-service
          python -m pip install -r requirements.txt
          nohup python -m uvicorn main:app --host 127.0.0.1 --port 10810 > /tmp/inference.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:10810/health > /dev/null; then
              echo "inference service up"; exit 0
            fi
            sleep 2
          done
          echo "::error::inference service failed to start"
          cat /tmp/inference.log
          exit 1

      - name: Prepare test database schema
        # migrate deploy cannot replay history from zero: the `group_members`
        # table (still a live model in schema.prisma) predates the migration
        # baseline and is only ever referenced by
        # 20260712040000_drop_unused_schema — no migration creates it, so
        # replay dies with 42P01 "relation group_members does not exist" on a
        # fresh DB. Build the schema straight from schema.prisma instead.
        # (Production keeps migrate deploy — its history is applied there.)
        # No --skip-generate: the client must exist for seed + vitest, and
        # postinstall is unreliable on warm store caches (see lint job).
        run: cd backend && npx prisma db push
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mt_test?schema=public

      # Route integration tests are fail-loud and require seeded fixtures
      # (admin@trademind.com, wheat_cme, …) — a schema push alone leaves the
      # tables empty.
      - name: Seed test database
        run: cd backend && npx prisma db seed
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mt_test?schema=public

      # correlationAnalysis.test.ts still drives the real HTTP surface on
      # :8000 (the one old-style suite predating the in-process createTestApp).
      # Scraper boot noise is background-only; outbound fetch failures are
      # per-source caught and do not affect the HTTP endpoints under test.
      - name: Start backend server
        run: |
          cd backend
          nohup npx tsx src/server.ts > /tmp/backend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then echo "backend up"; exit 0; fi
            sleep 2
          done
          echo "::error::backend failed to start"
          tail -50 /tmp/backend.log
          exit 1
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mt_test?schema=public
          REDIS_URL: redis://localhost:6379
          INFERENCE_URL: http://127.0.0.1:10810
          JWT_SECRET: ci-only-jwt-secret-32-chars-minimum-ok!
          SESSION_SECRET: ci-only-session-secret-32-chars-minimum!

      - name: Run tests
        run: cd backend && pnpm test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mt_test?schema=public
          REDIS_URL: redis://localhost:6379

      - name: Generate coverage report
        run: cd backend && pnpm run test:coverage
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mt_test?schema=public
          REDIS_URL: redis://localhost:6379

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./backend/coverage/lcov.info
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          cd frontend && pnpm install

      - name: Run tests
        run: cd frontend && pnpm test

      - name: Build frontend
        run: cd frontend && pnpm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/.next
          retention-days: 7

  test-inference:
    name: Inference Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: inference-service/requirements-dev.txt

      - name: Install dependencies
        run: |
          cd inference-service
          pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: cd inference-service && ruff check .

      - name: Run tests
        run: cd inference-service && pytest -q

  # ============================================================================
  # Build Artifacts
  # ============================================================================
  build:
    name: Build Artifacts
    runs-on: ubuntu-latest
    needs: [security-scan, lint-and-typecheck, test-backend, test-frontend, test-inference]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install and build backend
        run: |
          cd backend
          pnpm install
          npx prisma generate
          pnpm run build

      - name: Install and build frontend
        run: |
          cd frontend
          pnpm install
          pnpm run build

      - name: Upload backend build
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: backend/dist/
          retention-days: 7

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/.next/
          retention-days: 7

  # ============================================================================
  # Deploy to Production (PM2-based)
  # ============================================================================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 30
    environment:
      name: production
      url: https://trademind.example.com
    # `secrets` is not a legal context in steps.if — bridge it through job env.
    env:
      DEPLOY_CONFIGURED: ${{ secrets.DEPLOY_HOST != '' }}

    steps:
      - name: Deploy to server
        # Without DEPLOY_* secrets the ssh-action dies with "missing server
        # host" and paints the pipeline red for a config gap, not a code
        # fault — so skip explicitly and say why.
        if: env.DEPLOY_CONFIGURED == 'true'
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          script: |
            set -e

            # Navigate to project directory
            cd ${{ secrets.PROJECT_PATH || '/root' }}

            # Pull latest changes
            git pull origin main

            # Install dependencies
            cd backend && pnpm install --frozen-lockfile
            cd ../frontend && pnpm install --frozen-lockfile

            # Build backend (generate first: warm pnpm store skips the
            # @prisma/client postinstall, see test jobs)
            cd ../backend && npx prisma generate && pnpm run build

            # Build frontend
            cd ../frontend && pnpm run build

            # Run database migrations
            cd ../backend
            npx prisma migrate deploy

            # Restart services with PM2 (zero-downtime reload)
            cd ${{ secrets.PROJECT_PATH || '/root' }}
            pm2 reload ecosystem.config.cjs --env production
            pm2 save

            # Run health checks
            ./scripts/health-check.sh

            echo "Deployment completed successfully!"

      - name: Skip deploy (DEPLOY_* secrets not configured)
        if: env.DEPLOY_CONFIGURED == 'false'
        run: |
          echo "::warning::All quality gates passed, but DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY secrets are not set — production deploy skipped. Add them (Settings → Secrets → Actions) to activate auto-deploy; until then deploys stay manual on the server."

      - name: Verify deployment
        if: env.DEPLOY_CONFIGURED == 'true'
        run: |
          sleep 30
          curl -f ${{ secrets.APP_URL }}/health || exit 1
          echo "Deployment verification successful!"

      - name: Notify deployment success
        if: success() && env.DEPLOY_CONFIGURED == 'true'
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            Deployment to production successful!
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
        continue-on-error: true

      - name: Notify deployment failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          text: |
            Deployment to production FAILED!
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
            Please investigate immediately.
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
        continue-on-error: true

  # ============================================================================
  # Rollback on Failure
  # ============================================================================
  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    needs: deploy
    # `if: failure()` sees the whole needs chain, so this fires even when the
    # deploy job was merely skipped by an upstream (quality-gate) failure —
    # observed live: rollback "ran" and died at "missing server host" on every
    # red pipeline. Two guards on the SSH step below: only when deploy
    # actually FAILED (not skipped) and deploy credentials exist. Reverting a
    # commit that was never deployed would be worse than useless.
    if: failure()
    timeout-minutes: 15
    env:
      DEPLOY_CONFIGURED: ${{ secrets.DEPLOY_HOST != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rollback deployment
        if: needs.deploy.result == 'failure' && env.DEPLOY_CONFIGURED == 'true'
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          script: |
            set -e

            cd ${{ secrets.PROJECT_PATH || '/root' }}

            # Revert to previous commit
            git revert HEAD --no-edit

            # Rebuild and restart
            cd backend && pnpm install && pnpm run build
            cd ../frontend && pnpm install && pnpm run build

            # Restart with PM2
            cd ${{ secrets.PROJECT_PATH || '/root' }}
            pm2 reload ecosystem.config.cjs --env production
            pm2 save

            echo "Rollback completed!"

      - name: Skip rollback (nothing was deployed by CI)
        if: needs.deploy.result != 'failure' || env.DEPLOY_CONFIGURED == 'false'
        run: |
          echo "::warning::Rollback triggered, but CI never deployed anything in this run (deploy ${{ needs.deploy.result }}, DEPLOY_* secrets ${{ env.DEPLOY_CONFIGURED == 'true' && 'set' || 'unset' }}). Fix the failing quality gates instead — production was not touched."

      - name: Notify rollback
        if: needs.deploy.result == 'failure' && env.DEPLOY_CONFIGURED == 'true'
        uses: 8398a7/action-slack@v3
        with:
          status: warning
          text: |
            Deployment was rolled back due to failure!
            Previous version restored.
            Please investigate the issue.
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
        continue-on-error: true
