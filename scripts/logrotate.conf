# ============================================================================
# MT - Logrotate Configuration for PM2 Logs
# ============================================================================
# This file is the repo source copy of the LIVE system config at
# /etc/logrotate.d/trademind. Keep both in sync — round-111 (2026-08-20)
# found them drifted (repo said rotate 14 + pm2 reloadLogs postrotate;
# live said rotate 7 + maxsize 50M). The live version below is authoritative:
# copytruncate makes the pm2 reloadLogs postrotate unnecessary.
#
# Install:
#   sudo cp /root/scripts/logrotate.conf /etc/logrotate.d/trademind
#
# Test (dry run):
#   sudo logrotate -d /etc/logrotate.d/trademind
# ============================================================================

/root/.logs/*.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    maxsize 50M
    dateext
    dateformat -%Y%m%d
}
